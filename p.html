#include <stdio.h>
#define MAX 100

void selectionSort(float arr[], int n) {
    int i, j, minIndex;
    float temp;

    for (i = 0; i < n - 1; i++) {
        minIndex = i;

        for (j = i + 1; j < n; j++) {
            if (arr[j] < arr[minIndex])
                minIndex = j;
        }

        if (minIndex != i) {
            temp = arr[i];
            arr[i] = arr[minIndex];
            arr[minIndex] = temp;
        }
    }
}

void bubbleSort(float arr[], int n) {
    int i, j;
    float temp;

    for (i = 0; i < n - 1; i++) {
        for (j = 0; j < n - i - 1; j++) {
            if (arr[j] > arr[j + 1]) {
                temp = arr[j];
                arr[j] = arr[j + 1];
                arr[j + 1] = temp;
            }
        }
    }
}

void displayArray(float arr[], int n) {
    int i;
    for (i = 0; i < n; i++)
        printf("%.2f\\t", arr[i]);
    printf("\\n");
}

void displayTop5(float arr[], int n) {
    int i, count = (n < 5) ? n : 5;

    printf("Top %d scores (highest first):\\n", count);
    for (i = n - 1; i >= n - count; i--)
        printf("%.2f\\n", arr[i]);
}

"3": String.raw`/* Practical 3: Telephone Book Database Using Hash Table */
#include <stdio.h>
#define SIZE 11

typedef struct {
    long phone;
    int occupied;
} Entry;

Entry table[SIZE];

int hash1(long key) {
    return (int)(key % SIZE);
}

int hash2(long key) {
    return 7 - (int)(key % 7);
}

int probeIndex(long key, int i, int method) {
    int h = hash1(key);

    if (method == 1)
        return (h + i) % SIZE;
    if (method == 2)
        return (h + i * i) % SIZE;

    return (h + i * hash2(key)) % SIZE;
}

void insertPhone(long key, int method) {
    int i, idx;

    for (i = 0; i < SIZE; i++) {
        idx = probeIndex(key, i, method);

        if (table[idx].occupied && table[idx].phone == key) {
            printf("Phone number already exists at index %d.\\n", idx);
            return;
        }

        if (!table[idx].occupied) {
            table[idx].phone = key;
            table[idx].occupied = 1;
            printf("Phone number inserted at index %d.\\n", idx);
            return;
        }
    }

    printf("Hash table is full; unable to insert.\\n");
}

void searchPhone(long key, int method) {
    int i, idx;

    for (i = 0; i < SIZE; i++) {
        idx = probeIndex(key, i, method);

        if (!table[idx].occupied) {
            printf("Phone number not found.\\n");
            return;
        }

        if (table[idx].phone == key) {
            printf("Phone number found at index %d.\\n", idx);
            return;
        }
    }

    printf("Phone number not found.\\n");
}

void displayTable(void) {
    int i;

    printf("Index\\tPhone Number\\n");
    for (i = 0; i < SIZE; i++) {
        if (table[i].occupied)
            printf("%d\\t%ld\\n", i, table[i].phone);
        else
            printf("%d\\t---\\n", i);
    }
}

int main(void) {
    int choice, method;
    long key;

    do {
        printf("\\n----- MENU -----\\n");
        printf("1. Insert phone number\\n");
        printf("2. Search phone number\\n");
        printf("3. Display hash table\\n");
        printf("4. Exit\\nChoice: ");
        scanf("%d", &choice);

        if (choice == 1 || choice == 2) {
            printf("Enter phone number: ");
            scanf("%ld", &key);

            printf("Collision method (1.Linear 2.Quadratic 3.Double Hashing): ");
            scanf("%d", &method);

            if (method < 1 || method > 3) {
                printf("Invalid method.\\n");
                continue;
            }

            if (choice == 1)
                insertPhone(key, method);
            else
                searchPhone(key, method);

        } else if (choice == 3) {
            displayTable();
        } else if (choice == 4) {
            printf("Program terminated.\\n");
        } else {
            printf("Invalid choice.\\n");
        }
    } while (choice != 4);

    return 0;
}`,

"4": String.raw`/* Practical 4: Pinnacle Club Membership Using Singly Linked List */
#include <stdio.h>
#include <stdlib.h>
#include <string.h>

typedef struct Node {
    int prn;
    char name[50];
    struct Node *next;
} Node;

Node *createNode(int prn, const char *name) {
    Node *n = (Node *)malloc(sizeof(Node));

    if (!n) {
        printf("Memory allocation failed.\\n");
        exit(1);
    }

    n->prn = prn;
    strncpy(n->name, name, sizeof(n->name) - 1);
    n->name[sizeof(n->name) - 1] = '\\0';
    n->next = NULL;

    return n;
}

void addPresident(Node **head, int prn, const char *name) {
    Node *n = createNode(prn, name);
    n->next = *head;
    *head = n;
}

void addSecretary(Node **head, int prn, const char *name) {
    Node *n = createNode(prn, name), *p;

    if (!*head) {
        *head = n;
        return;
    }

    p = *head;
    while (p->next)
        p = p->next;

    p->next = n;
}

void addMember(Node **head, int prn, const char *name) {
    Node *n = createNode(prn, name), *p;

    if (!*head || !(*head)->next) {
        addSecretary(head, prn, name);
        free(n);
        return;
    }

    p = (*head)->next;
    while (p->next && p->next->next)
        p = p->next;

    n->next = p->next;
    p->next = n;
}

void deletePRN(Node **head, int prn) {
    Node *p = *head, *prev = NULL;

    while (p && p->prn != prn) {
        prev = p;
        p = p->next;
    }

    if (!p) {
        printf("Member not found.\\n");
        return;
    }

    if (prev)
        prev->next = p->next;
    else
        *head = p->next;

    free(p);
    printf("Member deleted.\\n");
}

void display(Node *head) {
    int count = 0;

    if (!head) {
        printf("No members in the club.\\n");
        return;
    }

    printf("\\nPRN\\tName\\n");
    while (head) {
        printf("%d\\t%s\\n", head->prn, head->name);
        count++;
        head = head->next;
    }

    printf("Total members: %d\\n", count);
}

void concatenate(Node **first, Node *second) {
    Node *p;

    if (!*first) {
        *first = second;
        return;
    }

    p = *first;
    while (p->next)
        p = p->next;

    p->next = second;
}

void freeList(Node *head) {
    Node *tmp;

    while (head) {
        tmp = head;
        head = head->next;
        free(tmp);
    }
}

int main(void) {
    Node *head = NULL, *other = NULL;
    int choice, prn;
    char name[50];

    do {
        printf("\\n--- Pinnacle Club MENU ---\\n");
        printf("1. Add President\\n");
        printf("2. Add Secretary\\n");
        printf("3. Add Member\\n");
        printf("4. Delete Member by PRN\\n");
        printf("5. Display Members\\n");
        printf("6. Concatenate another list\\n");
        printf("7. Exit\\nChoice: ");
        scanf("%d", &choice);

        switch (choice) {
            case 1:
                printf("Enter PRN and name: ");
                scanf("%d %49s", &prn, name);
                addPresident(&head, prn, name);
                break;

            case 2:
                printf("Enter PRN and name: ");
                scanf("%d %49s", &prn, name);
                addSecretary(&head, prn, name);
                break;

            case 3:
                printf("Enter PRN and name: ");
                scanf("%d %49s", &prn, name);
                addMember(&head, prn, name);
                break;

            case 4:
                printf("Enter PRN to delete: ");
                scanf("%d", &prn);
                deletePRN(&head, prn);
                break;

            case 5:
                display(head);
                break;

            case 6:
                printf("Enter PRN and name for the other list: ");
                scanf("%d %49s", &prn, name);
                addSecretary(&other, prn, name);
                concatenate(&head, other);
                other = NULL;
                printf("Lists concatenated.\\n");
                break;

            case 7:
                printf("Program terminated.\\n");
                break;

            default:
                printf("Invalid choice.\\n");
        }
    } while (choice != 7);

    freeList(head);
    freeList(other);
    return 0;
}`,

"5": String.raw`/* Practical 5: Cinemax Ticket Booking Using Doubly Linked List */
#include <stdio.h>
#include <stdlib.h>
#define ROWS 5
#define SEATS 10

typedef struct Seat {
    int seatNo;
    int booked;
    struct Seat *prev;
    struct Seat *next;
} Seat;

Seat *rowHead[ROWS];

void createRows(void) {
    int r, s;

    for (r = 0; r < ROWS; r++) {
        Seat *tail = NULL;
        rowHead[r] = NULL;

        for (s = 1; s <= SEATS; s++) {
            Seat *n = (Seat *)malloc(sizeof(Seat));

            if (!n) {
                printf("Memory allocation failed.\\n");
                exit(1);
            }

            n->seatNo = s;
            n->booked = 0;
            n->prev = tail;
            n->next = NULL;

            if (tail)
                tail->next = n;
            else
                rowHead[r] = n;

            tail = n;
        }
    }
}

Seat *findSeat(int row, int seatNo) {
    Seat *p;

    if (row < 0 || row >= ROWS)
        return NULL;

    p = rowHead[row];
    while (p && p->seatNo != seatNo)
        p = p->next;

    return p;
}

void viewAvailable(int row) {
    Seat *p;

    if (row < 0 || row >= ROWS) {
        printf("Invalid row.\\n");
        return;
    }

    printf("Available seats in row %d: ", row + 1);
    for (p = rowHead[row]; p; p = p->next) {
        if (!p->booked)
            printf("%d ", p->seatNo);
    }
    printf("\\n");
}

void bookSeat(int row, int seatNo) {
    Seat *p = findSeat(row, seatNo);

    if (!p)
        printf("Invalid row or seat.\\n");
    else if (p->booked)
        printf("Seat is already booked.\\n");
    else {
        p->booked = 1;
        printf("Seat booked successfully.\\n");
    }
}

void cancelSeat(int row, int seatNo) {
    Seat *p = findSeat(row, seatNo);

    if (!p)
        printf("Invalid row or seat.\\n");
    else if (!p->booked)
        printf("Seat is not booked.\\n");
    else {
        p->booked = 0;
        printf("Booking cancelled.\\n");
    }
}

void displayAll(void) {
    int r;
    Seat *p;

    for (r = 0; r < ROWS; r++) {
        printf("Row %2d: ", r + 1);

        for (p = rowHead[r]; p; p = p->next)
            printf("%d(%s) ", p->seatNo,
                   p->booked ? "Booked" : "Free");

        printf("\\n");
    }
}

void freeRows(void) {
    int r;

    for (r = 0; r < ROWS; r++) {
        Seat *p = rowHead[r], *tmp;

        while (p) {
            tmp = p;
            p = p->next;
            free(tmp);
        }
    }
}

int main(void) {
    int choice, row, seat;

    createRows();

    do {
        printf("\\n--- Cinemax Ticket Booking ---\\n");
        printf("1. View available seats\\n");
        printf("2. Book seat\\n");
        printf("3. Cancel booking\\n");
        printf("4. Display all seats\\n");
        printf("5. Exit\\nChoice: ");
        scanf("%d", &choice);

        switch (choice) {
            case 1:
                printf("Enter row (1-%d): ", ROWS);
                scanf("%d", &row);
                viewAvailable(row - 1);
                break;

            case 2:
                printf("Enter row and seat: ");
                scanf("%d%d", &row, &seat);
                bookSeat(row - 1, seat);
                break;

            case 3:
                printf("Enter row and seat: ");
                scanf("%d%d", &row, &seat);
                cancelSeat(row - 1, seat);
                break;

            case 4:
                displayAll();
                break;

            case 5:
                printf("Program terminated.\\n");
                break;

            default:
                printf("Invalid choice.\\n");
        }
    } while (choice != 5);

    freeRows();
    return 0;
}`,

"6": String.raw`/* Practical 6: Checking Balanced Parentheses Using Stack */
#include <stdio.h>
#define MAX 100

char stack[MAX];
int top = -1;

void push(char c) {
    if (top == MAX - 1) {
        printf("Stack Overflow\\n");
        return;
    }

    stack[++top] = c;
}

char pop(void) {
    if (top == -1)
        return '\\0';

    return stack[top--];
}

int isEmpty(void) {
    return top == -1;
}

int isMatchingPair(char open, char close) {
    return (open == '(' && close == ')') ||
           (open == '{' && close == '}') ||
           (open == '[' && close == ']');
}

int checkBalanced(const char expr[]) {
    int i;
    top = -1;

    for (i = 0; expr[i] != '\\0'; i++) {
        char ch = expr[i];

        if (ch == '(' || ch == '{' || ch == '[') {
            push(ch);
        } else if (ch == ')' || ch == '}' || ch == ']') {
            char open;

            if (isEmpty())
                return 0;

            open = pop();

            if (!isMatchingPair(open, ch))
                return 0;
        }
    }

    return isEmpty();
}

int main(void) {
    char expr[MAX];
    int choice;

    do {
        printf("\\n----- MENU -----\\n");
        printf("1. Check balanced delimiters\\n");
        printf("2. Exit\\nChoice: ");
        scanf("%d", &choice);

        if (choice == 1) {
            printf("Enter expression (no spaces): ");
            scanf("%99s", expr);

            if (checkBalanced(expr))
                printf("The expression is well parenthesized.\\n");
            else
                printf("The expression is NOT well parenthesized.\\n");

        } else if (choice == 2) {
            printf("Program terminated.\\n");
        } else {
            printf("Invalid choice.\\n");
        }
    } while (choice != 2);

    return 0;
}`,

"7": String.raw`/* Practical 7: Simulating a Job Queue Using Queue */
#include <stdio.h>
#define MAX 10

int queue[MAX];
int front = -1, rear = -1;

int isFull(void) {
    return rear == MAX - 1;
}

int isEmpty(void) {
    return front == -1 || front > rear;
}

void addJob(int jobId) {
    if (isFull()) {
        printf("Queue Overflow. Cannot add job %d\\n", jobId);
        return;
    }

    if (front == -1)
        front = 0;

    queue[++rear] = jobId;
    printf("Job %d added to the queue.\\n", jobId);
}

void deleteJob(void) {
    int jobId;

    if (isEmpty()) {
        printf("Queue Underflow. No job to process.\\n");
        return;
    }

    jobId = queue[front++];
    printf("Job %d processed and removed from the queue.\\n", jobId);

    if (front > rear)
        front = rear = -1;
}

void displayQueue(void) {
    int i;

    if (isEmpty()) {
        printf("Job queue is empty.\\n");
        return;
    }

    printf("Jobs in queue (front to rear): ");
    for (i = front; i <= rear; i++)
        printf("%d ", queue[i]);

    printf("\\n");
}

int main(void) {
    int choice, jobId;

    do {
        printf("\\n----- Job Queue MENU -----\\n");
        printf("1. Add Job\\n");
        printf("2. Process/Delete Job\\n");
        printf("3. Display Queue\\n");
        printf("4. Exit\\nChoice: ");
        scanf("%d", &choice);

        switch (choice) {
            case 1:
                printf("Enter Job ID: ");
                scanf("%d", &jobId);
                addJob(jobId);
                break;

            case 2:
                deleteJob();
                break;

            case 3:
                displayQueue();
                break;

            case 4:
                printf("Program terminated.\\n");
                break;

            default:
                printf("Invalid choice.\\n");
        }
    } while (choice != 4);

    return 0;
}`,

#include <stdio.h>
#include <stdlib.h>

typedef struct Node {
    int data;
    struct Node *left, *right;
} Node;

Node *createNode(int value) {
    Node *n = (Node *)malloc(sizeof(Node));

    if (!n) {
        printf("Memory allocation failed.\\n");
        exit(1);
    }

    n->data = value;
    n->left = n->right = NULL;

    return n;
}

Node *insert(Node *root, int value) {
    if (!root)
        return createNode(value);

    if (value < root->data)
        root->left = insert(root->left, value);
    else if (value > root->data)
        root->right = insert(root->right, value);
    else
        printf("Duplicate value ignored.\\n");

    return root;
}

void inorder(Node *root) {
    if (root) {
        inorder(root->left);
        printf("%d ", root->data);
        inorder(root->right);
    }
}

int height(Node *root) {
    int leftHeight, rightHeight;

    if (!root)
        return 0;

    leftHeight = height(root->left);
    rightHeight = height(root->right);

    return 1 + (leftHeight > rightHeight ? leftHeight : rightHeight);
}

int minValue(Node *root) {
    if (!root)
        return -1;

    while (root->left)
        root = root->left;

    return root->data;
}

Node *search(Node *root, int key) {
    if (!root || root->data == key)
        return root;

    if (key < root->data)
        return search(root->left, key);

    return search(root->right, key);
}

void mirror(Node *root) {
    Node *tmp;

    if (!root)
        return;

    tmp = root->left;
    root->left = root->right;
    root->right = tmp;

    mirror(root->left);
    mirror(root->right);
}

void freeTree(Node *root) {
    if (root) {
        freeTree(root->left);
        freeTree(root->right);
        free(root);
    }
}
